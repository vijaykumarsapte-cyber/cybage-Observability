apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: default

  labels:
    app: postgres

spec:
  containers:
    - name: postgres
      image: postgres:15

      env:
        - name: POSTGRES_DB
          value: demo_db

        - name: POSTGRES_USER
          value: demo

        - name: POSTGRES_PASSWORD
          value: demo

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: default

spec:
  selector:
    app: postgres

  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432