apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: demo-api

  template:
    metadata:
      labels:
        app: demo-api

    spec:
      containers:
        - name: demo-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: DATABASE_URL
              value: postgresql://demo:demo@postgres-service:5432/demo_db

          readinessProbe:
            httpGet:
              path: /users
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /users
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10