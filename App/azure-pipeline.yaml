              - task: AzureCLI@2
                displayName: 'Deploy Observability Stack'
                inputs:
                  azureSubscription: '$(serviceConnection)'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    set -euo pipefail
                    az account set --subscription "$(subscriptionId)"

                    # The AKS API is private: kubectl/helm run inside the cluster via
                    # `az aks command invoke`. It returns 0 even when the remote command
                    # fails, so read exitCode from the JSON result and fail on non-zero.
                    invoke() {
                      local cmd="$1"; shift
                      az aks command invoke -g "$(resourceGroup)" -n "$(aksCluster)" \
                        --command "$cmd" "$@" -o json > invoke.json
                      python3 -c "import json;d=json.load(open('invoke.json'));print(d.get('logs',''));raise SystemExit(d.get('exitCode',1))"
                    }

                    echo "=================================================="
                    echo "Checking AKS connectivity..."
                    echo "=================================================="
                    invoke "kubectl get nodes -o wide"
                    echo "AKS connectivity validated successfully."

                    echo "=============================================="
                    echo "Deploying Observability Stack to Private AKS"
                    echo "=============================================="
                    invoke "bash deploy-observability.sh" --file "$(appDir)/deploy-observability.sh"

                    echo "=============================================="
                    echo "Deploying tempo and OTEL Stack to Private AKS"
                    echo "=============================================="
                    invoke "bash deploy-tempo-otel.sh" --file "$(appDir)/deploy-tempo-otel.sh"

                    echo "=============================================="
                    echo "Grafana: Tempo data source + /grafana via Application Gateway"
                    echo "=============================================="
                    invoke "kubectl apply -f grafana-datasource-tempo.yaml -f grafana-ingress.yaml && kubectl get ingress -A" \
                      --file "$(appDir)/k8/grafana-datasource-tempo.yaml" \
                      --file "$(appDir)/k8/grafana-ingress.yaml"

                    echo "=============================================="
                    echo "Observability Stack deployment completed"
                    echo "=============================================="



