                inputs:
                  azureSubscription: '$(serviceConnection)'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    set -euo pipefail
                    az account set --subscription "$(subscriptionId)"
                    invoke() {
                      local cmd="$1"; shift
                      az aks command invoke -g "$(resourceGroup)" -n "$(aksCluster)" \
                        --command "$cmd" "$@" -o json > invoke.json
                      python3 -c "import json;d=json.load(open('invoke.json'));print(d.get('logs',''));raise SystemExit(d.get('exitCode',1))"
                    }
                    IMAGE="$(acrName).azurecr.io/$(imageName):$(imageTag)"
                    # Substitute the image on the agent (sed is not available inside command invoke).
                    OUT="$(Agent.TempDirectory)/demo-app"; mkdir -p "$OUT"
                    cp "$(appDir)/k8/postgres.yaml" "$(appDir)/k8/service.yaml" "$(appDir)/k8/ingress.yaml" "$OUT/"
                    sed "s|IMAGE_PLACEHOLDER|$IMAGE|" "$(appDir)/k8/deployment.yaml" > "$OUT/deployment.yaml"
                    grep -n "image:" "$OUT/deployment.yaml"

                    invoke "kubectl apply -f postgres.yaml -f deployment.yaml -f service.yaml -f ingress.yaml && kubectl rollout status deployment/demo-api -n default --timeout=300s" \
                      --file "$OUT/postgres.yaml" --file "$OUT/deployment.yaml" \
                      --file "$OUT/service.yaml" --file "$OUT/ingress.yaml"

                    # Demo data for GET /users (John, Jerry). Idempotent; the table is
                    # created by `prisma db push` when demo-api starts (rollout above).
                    invoke "kubectl exec -i postgres -n default -- psql -v ON_ERROR_STOP=1 -U demo -d demo_db < seed-users.sql" \
                      --file "$(appDir)/k8/seed-users.sql"
                    invoke "kubectl get pods,svc,endpoints,ingress -n default -o wide"

              # ==========================================
