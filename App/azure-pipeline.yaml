                  azureSubscription: 'ServiceConnection-Sp'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    set -e

                    echo "=================================================="
                    echo "Checking AKS connectivity..."
                    echo "=================================================="

                    az aks command invoke \
                      --resource-group "$(resourceGroup)" \
                      --name "$(aksCluster)" \
                      --command "kubectl get nodes"

                    echo ""
                    echo "AKS connectivity validated successfully."

                    echo "=============================================="
                    echo "Deploying Observability Stack to Private AKS"
                    echo "=============================================="

                    az aks command invoke \
                      --resource-group rg-observability-dev \
                      --name aks-observability-dev \
                      --command "bash deploy-observability.sh" \
                      --file $(System.DefaultWorkingDirectory)/deploy-observability.sh
                    
                    echo "=============================================="
                    echo "Deploying tempo and OTEL Stack to Private AKS"
                    echo "=============================================="

                    az aks command invoke \
                      --resource-group rg-observability-dev \
                      --name aks-observability-dev \
                      --command "bash deploy-tempo-otel.sh" \
                      --file $(System.DefaultWorkingDirectory)/deploy-tempo-otel.sh

                    echo "=============================================="
                    echo "Observability Stack deployment completed"
                    echo "=============================================="



