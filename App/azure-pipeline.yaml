

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  serviceConnection: 'ServiceConnection-Sp'
  subscriptionId: '47226097-e6c5-43f7-95c7-865d71699fc9'   # azure subscription 1 (tenant ea48cb28-034a-4625-85d1-159be074cfab)
  location: 'centralindia'
  imageName: demo-api
  acrName: acrobspocdev01
  aksCluster: aks-observability-dev
  resourceGroup: rg-observability-dev
  imageTag: $(Build.BuildId)
  appDir: '$(System.DefaultWorkingDirectory)/App'   # repo root holds App/ and infra/

stages:

# =========================
# BUILD STAGE - build demo-api and push to the private ACR
# =========================
# acrobspocdev01 has public network access Disabled and a hosted agent is outside
# the VNet, so the push opens the registry ONLY to this agent's public IP
# (default action Deny) for the few minutes of the push, then restores the
# original settings (public access Disabled, default action Allow, no IP rules).
# Restoration runs even if the build fails (trap + always() step).
- stage: Build
  jobs:
    - job: BuildAndPush
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: 'Build and push demo-api (temporary agent-IP access)'
          inputs:
            azureSubscription: '$(serviceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -euo pipefail
              az account set --subscription "$(subscriptionId)"
              ACR="$(acrName)"
              IMAGE="$ACR.azurecr.io/$(imageName):$(imageTag)"

              restore() {
                echo "Restoring ACR network settings (public access Disabled)..."
                az acr network-rule remove -n "$ACR" --ip-address "$IP" -o none 2>/dev/null || true
                az acr update -n "$ACR" --default-action Allow --public-network-enabled false -o none
                az acr show -n "$ACR" --query "{public:publicNetworkAccess,ipRules:length(networkRuleSet.ipRules)}" -o table
              }

              IP=$(curl -fsS https://api.ipify.org)
              echo "Agent public IP: $IP"
              trap restore EXIT

              echo "Opening ACR to this agent IP only (default action Deny)..."
              az acr update -n "$ACR" --public-network-enabled true --default-action Deny -o none
              az acr network-rule add -n "$ACR" --ip-address "$IP" -o none

              echo "Building $IMAGE ..."
              docker build -t "$IMAGE" "$(appDir)/server"

              # Network rule changes take a short time to apply - retry login/push.
              for i in $(seq 1 12); do
                if az acr login -n "$ACR" && docker push "$IMAGE"; then PUSHED=1; break; fi
                echo "Push not allowed yet (attempt $i/12), waiting 15s..."; sleep 15
              done
              [ "${PUSHED:-0}" = 1 ] || { echo "##vso[task.logissue type=error]Push to $ACR failed"; exit 1; }
              echo "Pushed $IMAGE"

        # Safety net: make sure the registry is private again even if the agent
        # step was cancelled before its trap ran.
        - task: AzureCLI@2
          displayName: 'Ensure ACR public access is Disabled'
          condition: always()
          inputs:
            azureSubscription: '$(serviceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -euo pipefail
              az account set --subscription "$(subscriptionId)"
              for ip in $(az acr network-rule list -n "$(acrName)" --query "ipRules[].ipAddressOrRange" -o tsv); do
                az acr network-rule remove -n "$(acrName)" --ip-address "${ip%/32}" -o none || true
              done
              az acr update -n "$(acrName)" --default-action Allow --public-network-enabled false -o none
              az acr show -n "$(acrName)" --query "{public:publicNetworkAccess,defaultAction:networkRuleSet.defaultAction,ipRules:length(networkRuleSet.ipRules)}" -o table

