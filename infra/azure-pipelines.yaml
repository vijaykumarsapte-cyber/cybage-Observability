
trigger: none
pr: none

name: 'IaC-Observability-POC'

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: state-data

  - name: terraformVersion
    value: '1.9.8'

  - name: serviceConnection
    value: 'ServiceConnection-Sp'

  - name: stateResourceGroup
    value: 'rg-tfstate-observability'

  - name: stateStorageAccount
    value: 'stobsstatedev1'

  - name: stateContainer
    value: 'tfstate'

  - name: stateKey
    value: 'observability-platform.dev.tfstate'

  - name: terraformDirectory
    value: '$(System.DefaultWorkingDirectory)/components/observability'

  - name: workloadResourceGroup
    value: 'rg-observability-dev'

  - name: aksCluster
    value: 'aks-observability-dev'

stages:

# =====================================================
# STAGE 1: TERRAFORM VALIDATION
# =====================================================

- stage: tfvalidate
  displayName: 'Terraform Validation'
  jobs:
    - job: validate
      displayName: 'Terraform Init and Validate'
      continueOnError: false

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(stateResourceGroup)'
            backendAzureRmStorageAccountName: '$(stateStorageAccount)'
            backendAzureRmContainerName: '$(stateContainer)'
            backendAzureRmKey: '$(stateKey)'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Validate'
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(terraformDirectory)'

# =====================================================
# STAGE 2: TERRAFORM PLAN
# =====================================================

- stage: tfdeploy
  displayName: 'Terraform Plan and Apply'
  dependsOn: tfvalidate
  condition: succeeded('tfvalidate')

  jobs:

    # -------------------------------
    # JOB 1: TERRAFORM PLAN
    # -------------------------------

    - job: TerraformPlan
      displayName: 'Terraform Plan'

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(stateResourceGroup)'
            backendAzureRmStorageAccountName: '$(stateStorageAccount)'
            backendAzureRmContainerName: '$(stateContainer)'
            backendAzureRmKey: '$(stateKey)'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Plan'
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(terraformDirectory)'
            commandOptions: '-var-file="../../environments/dev/observability.tfvars" -out=tfplanfile'
            environmentServiceNameAzureRM: '$(serviceConnection)'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Terraform Plan'
          inputs:
            targetPath: '$(terraformDirectory)/tfplanfile'
            artifact: 'terraform-plan'

    # -------------------------------
    # JOB 2: MANUAL APPROVAL
    # -------------------------------

    - job: ManualApproval
      displayName: 'Manual Approval'
      dependsOn: TerraformPlan
      pool: server
      timeoutInMinutes: 60

      steps:
        - task: ManualValidation@1
          displayName: 'Approve Terraform Apply'
          timeoutInMinutes: 60
          inputs:
            instructions: |
              Review the Terraform Plan.
              Approve to continue with Terraform Apply.
              Reject to stop infrastructure deployment.
            onTimeout: 'reject'

    # -------------------------------
    # JOB 3: TERRAFORM APPLY
    # -------------------------------

    - job: TerraformApply
      displayName: 'Terraform Apply'
      dependsOn: ManualApproval
      condition: succeeded()

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: DownloadPipelineArtifact@2
          displayName: 'Download Terraform Plan'
          inputs:
            artifact: 'terraform-plan'
            path: '$(Pipeline.Workspace)/terraform-plan'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(stateResourceGroup)'
            backendAzureRmStorageAccountName: '$(stateStorageAccount)'
            backendAzureRmContainerName: '$(stateContainer)'
            backendAzureRmKey: '$(stateKey)'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Apply'
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(terraformDirectory)'
            commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplanfile'
            environmentServiceNameAzureRM: '$(serviceConnection)'

# =====================================================
# STAGE 3: KUBERNETES MANIFEST DEPLOYMENT
# =====================================================

- stage: k8s_apply
  displayName: 'Apply Kubernetes Manifests'
  dependsOn: tfdeploy
  condition: succeeded('tfdeploy')

  jobs:
    - job: apply_manifests
      displayName: 'Deploy Kubernetes Configuration'

      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: 'Apply Kubernetes Manifests'
          inputs:
            azureSubscription: '$(serviceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'

            inlineScript: |

              echo "Checking Azure Subscription"

              az account show --output table

              echo "Applying Kubernetes manifests through AKS"

              az aks command invoke \
                --resource-group "$(workloadResourceGroup)" \
                --name "$(aksCluster)" \
                --command "kubectl apply -f namespace.yaml -f pvc.yaml -f container-azm-ms-agentconfig.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/namespace.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/pvc.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/container-azm-ms-agentconfig.yaml"

              echo "Kubernetes manifest deployment completed"
