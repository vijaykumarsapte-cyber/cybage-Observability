# Azure DevOps pipeline - Observability Terraform + AKS
# Does not edit or generate files in the Git repository.
# Manual execution only; Microsoft-hosted Ubuntu agent.

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'ServiceConnection-Sp'
  terraformVersion: '1.9.8'

  # Azure Blob remote state
  stateResourceGroup: 'rg-tfstate-observability'
  stateStorageAccount: 'stobsstatedev1'
  stateContainer: 'tfstate'
  stateKey: 'observability-platform.dev.tfstate'
  subscriptionId: '47226097-e6c5-43f7-95c7-865d71699fc9'
  tenantId: 'ea48cb28-034a-4625-85d1-159be074cfab'

  # AKS target
  aksResourceGroup: 'rg-observability-dev'
  aksCluster: 'aks-observability-dev'

stages:
- stage: Validate
  displayName: 'Terraform validation'
  jobs:
  - job: ValidateTerraform
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y curl unzip
        VERSION="$(terraformVersion)"
        mkdir -p "$(Agent.TempDirectory)/terraform-bin"
        curl -fsSLo "$(Agent.TempDirectory)/terraform.zip" \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o "$(Agent.TempDirectory)/terraform.zip" -d "$(Agent.TempDirectory)/terraform-bin"
        sudo install -m 0755 "$(Agent.TempDirectory)/terraform-bin/terraform" /usr/local/bin/terraform
        terraform version
      displayName: 'Install Terraform'

    - bash: |
        set -euo pipefail
        ROOT="$(Build.SourcesDirectory)"
        echo "Searching for root Terraform configuration (excluding reusable modules)..."

        # First choice: a non-module directory containing module blocks.
        mapfile -t ROOT_CANDIDATES < <(
          find "$ROOT" -type f -name '*.tf' \
            -not -path '*/.terraform/*' \
            -not -path '*/modules/*' -print0 |
          xargs -0 -r grep -lE '^[[:space:]]*module[[:space:]]+"' |
          xargs -r -n1 dirname | sort -u
        )

        # Fallback: a non-module directory containing Terraform files.
        if [ "${#ROOT_CANDIDATES[@]}" -eq 0 ]; then
          mapfile -t ROOT_CANDIDATES < <(
            find "$ROOT" -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path '*/modules/*' -printf '%h\n' | sort -u
          )
        fi

        if [ "${#ROOT_CANDIDATES[@]}" -ne 1 ]; then
          echo "ERROR: Could not identify exactly one Terraform root directory."
          echo "Terraform directories outside reusable modules:"
          find "$ROOT" -type f -name '*.tf' \
            -not -path '*/.terraform/*' \
            -not -path '*/modules/*' -printf '%h\n' | sort -u || true
          echo "Root candidates:"
          printf '%s\n' "${ROOT_CANDIDATES[@]}"
          echo "No repository files have been changed."
          exit 1
        fi

        TF_DIR="${ROOT_CANDIDATES[0]}"
        echo "Selected Terraform root: $TF_DIR"

        terraform -chdir="$TF_DIR" fmt -check -recursive
        terraform -chdir="$TF_DIR" init -backend=false -input=false
        terraform -chdir="$TF_DIR" validate
      displayName: 'Detect Terraform root, format and validate'

- stage: Plan
  displayName: 'Terraform plan'
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - job: CreatePlan
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y curl unzip
        VERSION="$(terraformVersion)"
        mkdir -p "$(Agent.TempDirectory)/terraform-bin"
        curl -fsSLo "$(Agent.TempDirectory)/terraform.zip" \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o "$(Agent.TempDirectory)/terraform.zip" -d "$(Agent.TempDirectory)/terraform-bin"
        sudo install -m 0755 "$(Agent.TempDirectory)/terraform-bin/terraform" /usr/local/bin/terraform
        terraform version
      displayName: 'Install Terraform'

    - task: AzureCLI@2
      displayName: 'Terraform init and plan using Azure OIDC'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail
          ROOT="$(Build.SourcesDirectory)"

          mapfile -t ROOT_CANDIDATES < <(
            find "$ROOT" -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path '*/modules/*' -print0 |
            xargs -0 -r grep -lE '^[[:space:]]*module[[:space:]]+"' |
            xargs -r -n1 dirname | sort -u
          )
          if [ "${#ROOT_CANDIDATES[@]}" -eq 0 ]; then
            mapfile -t ROOT_CANDIDATES < <(
              find "$ROOT" -type f -name '*.tf' \
                -not -path '*/.terraform/*' \
                -not -path '*/modules/*' -printf '%h\n' | sort -u
            )
          fi
          if [ "${#ROOT_CANDIDATES[@]}" -ne 1 ]; then
            echo "ERROR: Expected one Terraform root directory; found ${#ROOT_CANDIDATES[@]}."
            printf 'Candidate: %s\n' "${ROOT_CANDIDATES[@]}"
            exit 1
          fi
          TF_DIR="${ROOT_CANDIDATES[0]}"

          # Find the environment tfvars file. Prefer the named observability file.
          mapfile -t VAR_FILES < <(
            find "$ROOT" -type f -name 'observability.tfvars' \
              -not -path '*/.terraform/*' | sort
          )
          if [ "${#VAR_FILES[@]}" -eq 0 ]; then
            mapfile -t VAR_FILES < <(
              find "$ROOT" -type f -name '*.tfvars' \
                -not -path '*/.terraform/*' | sort
            )
          fi
          if [ "${#VAR_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one observability.tfvars or .tfvars file; found ${#VAR_FILES[@]}."
            printf 'tfvars candidate: %s\n' "${VAR_FILES[@]}"
            exit 1
          fi
          VAR_FILE="${VAR_FILES[0]}"

          echo "Terraform root: $TF_DIR"
          echo "Terraform variables file: $VAR_FILE"

          # AzureCLI@2 supplies the federated identity values for this service connection.
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$(tenantId)"
          export ARM_SUBSCRIPTION_ID="$(subscriptionId)"
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN="$idToken"

          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="resource_group_name=$(stateResourceGroup)" \
            -backend-config="storage_account_name=$(stateStorageAccount)" \
            -backend-config="container_name=$(stateContainer)" \
            -backend-config="key=$(stateKey)" \
            -backend-config="subscription_id=$(subscriptionId)" \
            -backend-config="tenant_id=$(tenantId)" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

          mkdir -p "$(Build.ArtifactStagingDirectory)"
          terraform -chdir="$TF_DIR" plan -input=false \
            -var-file="$VAR_FILE" \
            -out="$(Build.ArtifactStagingDirectory)/tfplan"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - publish: '$(Build.ArtifactStagingDirectory)/tfplan'
      artifact: 'terraform-plan'
      displayName: 'Publish Terraform plan'

- stage: Approval
  displayName: 'Manual approval before apply'
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - job: WaitForApproval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Review the Terraform plan artifact produced by the Plan stage.
          Verify the Azure subscription, remote-state key, and all proposed
          changes. Reject the run if unexpected resources will be deleted
          or replaced. Approve only when the plan is correct.
        onTimeout: 'reject'

- stage: Apply
  displayName: 'Terraform apply'
  dependsOn: Approval
  condition: succeeded()
  jobs:
  - job: ApplyApprovedPlan
    steps:
    - checkout: self

    - download: current
      artifact: 'terraform-plan'
      displayName: 'Download approved Terraform plan'

    - bash: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y curl unzip
        VERSION="$(terraformVersion)"
        mkdir -p "$(Agent.TempDirectory)/terraform-bin"
        curl -fsSLo "$(Agent.TempDirectory)/terraform.zip" \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o "$(Agent.TempDirectory)/terraform.zip" -d "$(Agent.TempDirectory)/terraform-bin"
        sudo install -m 0755 "$(Agent.TempDirectory)/terraform-bin/terraform" /usr/local/bin/terraform
        terraform version
      displayName: 'Install Terraform'

    - task: AzureCLI@2
      displayName: 'Terraform init and apply approved plan using Azure OIDC'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail
          ROOT="$(Build.SourcesDirectory)"

          mapfile -t ROOT_CANDIDATES < <(
            find "$ROOT" -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path '*/modules/*' -print0 |
            xargs -0 -r grep -lE '^[[:space:]]*module[[:space:]]+"' |
            xargs -r -n1 dirname | sort -u
          )
          if [ "${#ROOT_CANDIDATES[@]}" -eq 0 ]; then
            mapfile -t ROOT_CANDIDATES < <(
              find "$ROOT" -type f -name '*.tf' \
                -not -path '*/.terraform/*' \
                -not -path '*/modules/*' -printf '%h\n' | sort -u
            )
          fi
          if [ "${#ROOT_CANDIDATES[@]}" -ne 1 ]; then
            echo "ERROR: Expected one Terraform root directory; found ${#ROOT_CANDIDATES[@]}."
            printf 'Candidate: %s\n' "${ROOT_CANDIDATES[@]}"
            exit 1
          fi
          TF_DIR="${ROOT_CANDIDATES[0]}"

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$(tenantId)"
          export ARM_SUBSCRIPTION_ID="$(subscriptionId)"
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN="$idToken"

          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="resource_group_name=$(stateResourceGroup)" \
            -backend-config="storage_account_name=$(stateStorageAccount)" \
            -backend-config="container_name=$(stateContainer)" \
            -backend-config="key=$(stateKey)" \
            -backend-config="subscription_id=$(subscriptionId)" \
            -backend-config="tenant_id=$(tenantId)" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

          PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERROR: Terraform plan artifact not found: $PLAN_FILE"
            exit 1
          fi

          terraform -chdir="$TF_DIR" apply -input=false -auto-approve "$PLAN_FILE"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: DeployKubernetes
  displayName: 'Deploy Kubernetes manifests'
  dependsOn: Apply
  condition: succeeded()
  jobs:
  - job: DeployManifests
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Apply observability manifests to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          ROOT="$(Build.SourcesDirectory)"

          # Locate the directory containing all three expected manifest files.
          mapfile -t MANIFEST_DIRS < <(
            find "$ROOT" -type f -name 'namespace.yaml' -not -path '*/.git/*' -printf '%h\n' |
            while IFS= read -r DIR; do
              if [ -f "$DIR/pvc.yaml" ] && [ -f "$DIR/container-azm-ms-agentconfig.yaml" ]; then
                printf '%s\n' "$DIR"
              fi
            done | sort -u
          )

          if [ "${#MANIFEST_DIRS[@]}" -ne 1 ]; then
            echo "ERROR: Expected one folder containing namespace.yaml, pvc.yaml and container-azm-ms-agentconfig.yaml."
            printf 'Manifest folder candidate: %s\n' "${MANIFEST_DIRS[@]}"
            exit 1
          fi
          K8S_DIR="${MANIFEST_DIRS[0]}"
          echo "Kubernetes manifest directory: $K8S_DIR"

          az aks show \
            --resource-group "$(aksResourceGroup)" \
            --name "$(aksCluster)" \
            --output table

          for MANIFEST in namespace.yaml pvc.yaml container-azm-ms-agentconfig.yaml; do
            az aks command invoke \
              --resource-group "$(aksResourceGroup)" \
              --name "$(aksCluster)" \
              --command "kubectl apply -f $MANIFEST" \
              --file "$K8S_DIR/$MANIFEST"
          done

          echo "Kubernetes manifests applied successfully."
