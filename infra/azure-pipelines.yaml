```yaml
trigger: none
pr: none

name: 'IaC-Observability-POC'

pool:
  name: 'LinuxPool'

variables:
  - group: state-data

stages:

# =====================================================
# STAGE 1: TERRAFORM VALIDATION
# =====================================================

- stage: tfvalidate
  displayName: 'Terraform Validation'
  jobs:
    - job: validate
      displayName: 'Terraform Init and Validate'
      steps:

        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '1.9.8'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/components/observability'
            backendServiceArm: 'ServiceConnection-Sp'
            backendAzureRmUseEnvironmentVariablesForAuthentication: true
            backendAzureRmUseEntraIdForAuthentication: true
            backendAzureRmResourceGroupName: 'rg-tfstate-observability'
            backendAzureRmStorageAccountName: 'stobsstatedev1'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'observability-platform.dev.tfstate'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Validate'
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/components/observability'


# =====================================================
# STAGE 2: TERRAFORM PLAN AND APPROVAL AND APPLY
# =====================================================

- stage: tfdeploy
  displayName: 'Terraform Plan and Apply'
  dependsOn: tfvalidate
  condition: succeeded()

  jobs:

    # -----------------------------------------------
    # JOB 1: TERRAFORM PLAN
    # -----------------------------------------------

    - job: TerraformPlan
      displayName: 'Terraform Plan'
      steps:

        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '1.9.8'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/components/observability'
            backendServiceArm: 'ServiceConnection-Sp'
            backendAzureRmUseEnvironmentVariablesForAuthentication: true
            backendAzureRmUseEntraIdForAuthentication: true
            backendAzureRmResourceGroupName: 'rg-tfstate-observability'
            backendAzureRmStorageAccountName: 'stobsstatedev1'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'observability-platform.dev.tfstate'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Plan'
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/components/observability'
            commandOptions: '-input=false -lock-timeout=5m -var-file="../../environments/dev/observability.tfvars" -out=tfplanfile'
            environmentServiceNameAzureRM: 'ServiceConnection-Sp'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Terraform Plan'
          inputs:
            targetPath: '$(System.DefaultWorkingDirectory)/components/observability/tfplanfile'
            artifact: 'terraform-plan'


    # -----------------------------------------------
    # JOB 2: MANUAL APPROVAL
    # -----------------------------------------------

    - job: ManualApproval
      displayName: 'Wait for Manual Approval'
      dependsOn: TerraformPlan
      pool: server
      timeoutInMinutes: 60
      steps:

        - task: ManualValidation@1
          displayName: 'Approve Terraform Apply'
          timeoutInMinutes: 60
          inputs:
            instructions: |
              Review the Terraform plan.
              Approve to continue with infrastructure deployment.
              Reject to stop the deployment.
            onTimeout: 'reject'


    # -----------------------------------------------
    # JOB 3: TERRAFORM APPLY
    # -----------------------------------------------

    - job: TerraformApply
      displayName: 'Terraform Apply'
      dependsOn: ManualApproval
      condition: succeeded()
      steps:

        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '1.9.8'

        - task: DownloadPipelineArtifact@2
          displayName: 'Download Terraform Plan'
          inputs:
            artifact: 'terraform-plan'
            path: '$(Pipeline.Workspace)/terraform-plan'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/components/observability'
            backendServiceArm: 'ServiceConnection-Sp'
            backendAzureRmUseEnvironmentVariablesForAuthentication: true
            backendAzureRmUseEntraIdForAuthentication: true
            backendAzureRmResourceGroupName: 'rg-tfstate-observability'
            backendAzureRmStorageAccountName: 'stobsstatedev1'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'observability-platform.dev.tfstate'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Apply'
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/components/observability'
            commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplanfile'
            environmentServiceNameAzureRM: 'ServiceConnection-Sp'


# =====================================================
# STAGE 3: KUBERNETES MANIFEST DEPLOYMENT
# =====================================================

- stage: k8s_apply
  displayName: 'Apply Kubernetes Manifests'
  dependsOn: tfdeploy
  condition: succeeded()

  jobs:
    - job: apply_manifests
      displayName: 'Deploy Kubernetes Configuration'
      steps:

        - checkout: self

        - task: AzureCLI@2
          displayName: 'Apply Kubernetes Namespace, PVC and Monitoring Configuration'
          inputs:
            azureSubscription: 'ServiceConnection-Sp'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |

              az aks command invoke \
                --resource-group rg-observability-dev \
                --name aks-observability-dev \
                --command "kubectl apply -f namespace.yaml -f pvc.yaml -f container-azm-ms-agentconfig.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/namespace.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/pvc.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/container-azm-ms-agentconfig.yaml"
```