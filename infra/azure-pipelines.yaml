trigger: none

name: 'IaC-Observability-POC'

# The demo application (image build + deploy) lives in App/azure-pipeline.yaml.

pool:
  vmImage: 'ubuntu-latest'
  

variables:
  terraformVersion: '1.9.8'
  serviceConnection: 'ServiceConnection-Sp'
  tfWorkingDir: '$(System.DefaultWorkingDirectory)/infra/components/observability'
  k8sDir: '$(System.DefaultWorkingDirectory)/infra/components/observability/k8s'
  # Remote state backend (created by hand once - build step 1)
  backendResourceGroup: 'rg-tfstate-observability'
  backendStorageAccount: 'stobsstatedev1'
  backendContainer: 'tfstate'
  backendKey: 'observability-platform.dev.tfstate'
  # Workload
  resourceGroup: 'rg-observability-dev'
  aksCluster: 'aks-observability-dev'

stages:
  - stage: tfvalidate
    jobs:
      - job: validate
        continueOnError: false
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(tfWorkingDir)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(tfWorkingDir)'

  - stage: tfdeploy
    condition: succeeded('tfvalidate')
    dependsOn: tfvalidate
    jobs:
      # 1. Plan
      - job: TerraformPlan
        displayName: Terraform Plan
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(tfWorkingDir)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(tfWorkingDir)'
              commandOptions: '-var-file="../../environments/dev/observability.tfvars" -out=tfplanfile'
              environmentServiceNameAzureRM: '$(serviceConnection)'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: '$(tfWorkingDir)/tfplanfile'
              artifact: 'terraform-plan'

      # 2. Manual approval - read the plan (added / changed / destroyed) first
      - job: ManualApproval
        displayName: Wait for Approval
        dependsOn: TerraformPlan
        pool: server
        timeoutInMinutes: 60
        steps:
          - task: ManualValidation@1
            displayName: Approve Terraform Apply
            timeoutInMinutes: 60
            inputs:
              instructions: 'Open the Terraform Plan job log, review what will be added, changed or destroyed, then approve or reject.'
              onTimeout: 'reject'

      # 3. Apply (only after approval)
      - job: TerraformApply
        displayName: Terraform Apply
        dependsOn: ManualApproval
        condition: succeeded()
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: Download Terraform Plan
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(tfWorkingDir)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(tfWorkingDir)'
              commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplanfile'
              environmentServiceNameAzureRM: '$(serviceConnection)'

  # The AKS API server is private: the agent cannot reach it, so every kubectl
  # call goes through `az aks command invoke` (runs inside the cluster network).
  - stage: k8s_apply
    displayName: 'Apply K8s Manifests'
    condition: succeeded('tfdeploy')
    dependsOn: tfdeploy
    jobs:
      - job: apply_manifests
        steps:
          - task: AzureCLI@2
            displayName: 'Apply namespace + PVC + PVC init job (+ Container Insights config)'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                invoke() {
                  # Usage: invoke "<command>" [--file f ...]. Fails the step on a non-zero kubectl exit code.
                  local cmd="$1"; shift
                  az aks command invoke -g "$(resourceGroup)" -n "$(aksCluster)" --command "$cmd" "$@" -o json > invoke.json
                  python3 -c "import json;d=json.load(open('invoke.json'));print(d.get('logs',''));raise SystemExit(d.get('exitCode',1))"
                }
                invoke "kubectl apply -f namespace.yaml -f pvc.yaml -f pvc-init-job.yaml -f container-azm-ms-agentconfig.yaml" \
                  --file "$(k8sDir)/namespace.yaml" \
                  --file "$(k8sDir)/pvc.yaml" \
                  --file "$(k8sDir)/pvc-init-job.yaml" \
                  --file "$(k8sDir)/container-azm-ms-agentconfig.yaml"
                # The storage class binds on first consumer (WaitForFirstConsumer); the
                # init Job is that consumer, so the disk is created and the PVC becomes Bound.
                invoke "kubectl wait --for=condition=complete job/observability-data-init -n observability --timeout=300s && kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc/observability-data -n observability --timeout=120s"
                invoke "kubectl get ns observability; kubectl get pvc,pv -n observability -o wide; kubectl get pods -n observability -o wide"
