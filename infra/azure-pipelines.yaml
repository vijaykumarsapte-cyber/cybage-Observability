# Azure DevOps pipeline - Observability Terraform + AKS
# Manual execution only. Uses Microsoft-hosted Ubuntu.
# SAFE MODE: Validate + Terraform Plan only; no apply or Kubernetes deployment.
# This pipeline does not create, update, or delete Azure infrastructure.
# No Git repository files are committed or pushed by this pipeline.
# terraform fmt may format the temporary agent checkout only.

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'ServiceConnection-Sp'
  terraformVersion: '1.9.8'

  # Confirmed from the latest pipeline log
  terraformWorkingDirectory: '$(Build.SourcesDirectory)/infra/components/observability'

  # Azure Blob remote state
  stateResourceGroup: 'rg-tfstate-observability'
  stateStorageAccount: 'stobsstatedev1'
  stateContainer: 'tfstate'
  stateKey: 'observability-platform.dev.tfstate'
  subscriptionId: '47226097-e6c5-43f7-95c7-865d71699fc9'
  tenantId: 'ea48cb28-034a-4625-85d1-159be074cfab'

  # AKS target
  aksResourceGroup: 'rg-observability-dev'
  aksCluster: 'aks-observability-dev'

stages:
- stage: Validate
  displayName: 'Terraform format and validation'
  jobs:
  - job: ValidateTerraform
    displayName: 'Validate Terraform configuration'
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y curl unzip
        VERSION="$(terraformVersion)"
        mkdir -p "$(Agent.TempDirectory)/terraform-bin"
        curl -fsSLo "$(Agent.TempDirectory)/terraform.zip" \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o "$(Agent.TempDirectory)/terraform.zip" -d "$(Agent.TempDirectory)/terraform-bin"
        sudo install -m 0755 "$(Agent.TempDirectory)/terraform-bin/terraform" /usr/local/bin/terraform
        terraform version
      displayName: 'Install Terraform $(terraformVersion)'

    - bash: |
        set -euo pipefail
        TF_DIR="$(terraformWorkingDirectory)"

        if [ ! -d "$TF_DIR" ]; then
          echo "ERROR: Terraform root directory does not exist: $TF_DIR"
          exit 1
        fi
        if [ ! -f "$TF_DIR/main.tf" ]; then
          echo "ERROR: main.tf not found in $TF_DIR"
          exit 1
        fi

        echo "Using confirmed Terraform root: $TF_DIR"
        echo "Terraform files:"
        find "$TF_DIR" -maxdepth 2 -type f -name '*.tf' -print | sort

        # Formats only the agent's temporary checkout; no commit or push is performed.
        terraform -chdir="$TF_DIR" fmt -recursive

        terraform -chdir="$TF_DIR" init -backend=false -input=false
        terraform -chdir="$TF_DIR" validate
      displayName: 'Format and validate Terraform'

- stage: Plan
  displayName: 'Terraform plan'
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - job: CreatePlan
    displayName: 'Create Terraform plan using Azure OIDC'
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y curl unzip
        VERSION="$(terraformVersion)"
        mkdir -p "$(Agent.TempDirectory)/terraform-bin"
        curl -fsSLo "$(Agent.TempDirectory)/terraform.zip" \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o "$(Agent.TempDirectory)/terraform.zip" -d "$(Agent.TempDirectory)/terraform-bin"
        sudo install -m 0755 "$(Agent.TempDirectory)/terraform-bin/terraform" /usr/local/bin/terraform
        terraform version
      displayName: 'Install Terraform $(terraformVersion)'

    - task: AzureCLI@2
      displayName: 'Terraform init and plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail
          TF_DIR="$(terraformWorkingDirectory)"
          ROOT="$(Build.SourcesDirectory)"

          ACTUAL_TENANT="$(az account show --query tenantId --output tsv)"
          ACTUAL_SUBSCRIPTION="$(az account show --query id --output tsv)"
          echo "Authenticated tenant: $ACTUAL_TENANT"
          echo "Authenticated subscription: $ACTUAL_SUBSCRIPTION"
          if [ "$ACTUAL_TENANT" != "$(tenantId)" ]; then
            echo "ERROR: Service connection tenant does not match the expected tenant."
            echo "Expected: $(tenantId) | Actual: $ACTUAL_TENANT"
            exit 1
          fi
          if [ "$ACTUAL_SUBSCRIPTION" != "$(subscriptionId)" ]; then
            echo "ERROR: Service connection subscription does not match the expected subscription."
            echo "Expected: $(subscriptionId) | Actual: $ACTUAL_SUBSCRIPTION"
            exit 1
          fi

          if [ ! -d "$TF_DIR" ] || [ ! -f "$TF_DIR/main.tf" ]; then
            echo "ERROR: Confirmed Terraform root is missing: $TF_DIR"
            exit 1
          fi

          # Prefer the exact environment file; otherwise accept one unique .tfvars file.
          VAR_FILE="$ROOT/infra/environments/dev/observability.tfvars"
          if [ ! -f "$VAR_FILE" ]; then
            VAR_FILE="$ROOT/environments/dev/observability.tfvars"
          fi
          if [ ! -f "$VAR_FILE" ]; then
            mapfile -t VAR_FILES < <(
              find "$ROOT" -type f -name '*.tfvars' \
                -not -path '*/.terraform/*' \
                -not -path '*/.git/*' | sort
            )
            if [ "${#VAR_FILES[@]}" -ne 1 ]; then
              echo "ERROR: Could not identify one tfvars file. Found ${#VAR_FILES[@]}."
              printf 'tfvars candidate: %s\n' "${VAR_FILES[@]}"
              exit 1
            fi
            VAR_FILE="${VAR_FILES[0]}"
          fi

          echo "Terraform root: $TF_DIR"
          echo "Variables file: $VAR_FILE"

          # AzureCLI@2 provides these values for a workload identity federation service connection.
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$(tenantId)"
          export ARM_SUBSCRIPTION_ID="$(subscriptionId)"
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_SKIP_PROVIDER_REGISTRATION=true

          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="resource_group_name=$(stateResourceGroup)" \
            -backend-config="storage_account_name=$(stateStorageAccount)" \
            -backend-config="container_name=$(stateContainer)" \
            -backend-config="key=$(stateKey)" \
            -backend-config="subscription_id=$(subscriptionId)" \
            -backend-config="tenant_id=$(tenantId)" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

          mkdir -p "$(Build.ArtifactStagingDirectory)"
          terraform -chdir="$TF_DIR" plan -input=false \
            -var-file="$VAR_FILE" \
            -out="$(Build.ArtifactStagingDirectory)/tfplan"

    - publish: '$(Build.ArtifactStagingDirectory)/tfplan'
      artifact: 'terraform-plan'
      displayName: 'Publish Terraform plan'

