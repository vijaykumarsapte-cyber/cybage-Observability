# Azure Observability Infrastructure Pipeline

trigger: none
pr: none

name: 'IaC-Observability-POC'

pool:
  name: LinuxPool

variables:
  - group: state-data

  - name: azureServiceConnection
    value: 'ServiceConnection-Sp'

  - name: resourceGroup
    value: 'rg-observability-dev'

  - name: aksCluster
    value: 'aks-observability-dev'

  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/components/observability'

  - name: terraformVersion
    value: '1.9.8'

  - name: stateResourceGroup
    value: 'rg-tfstate-observability'

  - name: stateStorageAccount
    value: 'stobsstatedev1'

  - name: stateContainer
    value: 'tfstate'

  - name: stateKey
    value: 'observability-platform.dev.tfstate'

stages:

# --------------------------------------------------
# STAGE 1: TERRAFORM VALIDATION
# --------------------------------------------------

- stage: tfvalidate
  displayName: 'Terraform Validate'

  jobs:
    - job: Validate
      displayName: 'Initialize and Validate Terraform'

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(azureServiceConnection)'
            backendAzureRmResourceGroupName: '$(stateResourceGroup)'
            backendAzureRmStorageAccountName: '$(stateStorageAccount)'
            backendAzureRmContainerName: '$(stateContainer)'
            backendAzureRmKey: '$(stateKey)'
            backendAzureRmUseEnvironmentVariablesForAuthentication: true
            backendAzureRmUseEntraIdForAuthentication: true

        - task: TerraformTaskV4@4
          displayName: 'Terraform Validate'
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(terraformWorkingDirectory)'

# --------------------------------------------------
# STAGE 2: TERRAFORM PLAN AND APPLY
# --------------------------------------------------

- stage: tfdeploy
  displayName: 'Terraform Plan and Apply'
  dependsOn: tfvalidate
  condition: succeeded()

  jobs:
    - job: Plan
      displayName: 'Terraform Plan'

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(azureServiceConnection)'
            backendAzureRmResourceGroupName: '$(stateResourceGroup)'
            backendAzureRmStorageAccountName: '$(stateStorageAccount)'
            backendAzureRmContainerName: '$(stateContainer)'
            backendAzureRmKey: '$(stateKey)'
            backendAzureRmUseEnvironmentVariablesForAuthentication: true
            backendAzureRmUseEntraIdForAuthentication: true

        - task: TerraformTaskV4@4
          displayName: 'Terraform Plan'
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(terraformWorkingDirectory)'
            commandOptions: '-input=false -lock-timeout=5m -var-file="../../environments/dev/observability.tfvars" -out=tfplanfile'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Terraform Plan'
          inputs:
            targetPath: '$(terraformWorkingDirectory)/tfplanfile'
            artifact: 'terraform-plan'
            publishLocation: 'pipeline'

    - job: Approval
      displayName: 'Manual Approval'
      dependsOn: Plan
      pool: server
      timeoutInMinutes: 1440

      steps:
        - task: ManualValidation@1
          displayName: 'Approve Terraform Apply'
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ''
            instructions: 'Review the Terraform plan artifact. Approve to continue with Terraform apply.'
            onTimeout: 'reject'

    - job: Apply
      displayName: 'Terraform Apply'
      dependsOn: Approval
      condition: succeeded()

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: DownloadPipelineArtifact@2
          displayName: 'Download Terraform Plan'
          inputs:
            artifact: 'terraform-plan'
            path: '$(Pipeline.Workspace)/terraform-plan'

        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(azureServiceConnection)'
            backendAzureRmResourceGroupName: '$(stateResourceGroup)'
            backendAzureRmStorageAccountName: '$(stateStorageAccount)'
            backendAzureRmContainerName: '$(stateContainer)'
            backendAzureRmKey: '$(stateKey)'
            backendAzureRmUseEnvironmentVariablesForAuthentication: true
            backendAzureRmUseEntraIdForAuthentication: true

        - task: TerraformTaskV4@4
          displayName: 'Terraform Apply'
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(terraformWorkingDirectory)'
            commandOptions: '-input=false -lock-timeout=5m "$(Pipeline.Workspace)/terraform-plan/tfplanfile"'

# --------------------------------------------------
# STAGE 3: KUBERNETES DEPLOYMENT
# --------------------------------------------------

- stage: k8s_apply
  displayName: 'Deploy Observability Kubernetes Manifests'
  dependsOn: tfdeploy
  condition: succeeded()

  jobs:
    - job: KubernetesDeploy
      displayName: 'Apply Kubernetes Manifests'

      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: 'Deploy Kubernetes Resources'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -e

              echo "Getting AKS credentials..."

              az aks get-credentials \
                --resource-group "$(resourceGroup)" \
                --name "$(aksCluster)" \
                --overwrite-existing

              echo "Applying Kubernetes namespace..."

              az aks command invoke \
                --resource-group "$(resourceGroup)" \
                --name "$(aksCluster)" \
                --command "kubectl apply -f namespace.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/namespace.yaml"

              echo "Applying PVC..."

              az aks command invoke \
                --resource-group "$(resourceGroup)" \
                --name "$(aksCluster)" \
                --command "kubectl apply -f pvc.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/pvc.yaml"

              echo "Applying Azure Monitor agent configuration..."

              az aks command invoke \
                --resource-group "$(resourceGroup)" \
                --name "$(aksCluster)" \
                --command "kubectl apply -f container-azm-ms-agentconfig.yaml" \
                --file "$(System.DefaultWorkingDirectory)/components/observability/k8s/container-azm-ms-agentconfig.yaml"

              echo "Kubernetes manifest deployment completed."
